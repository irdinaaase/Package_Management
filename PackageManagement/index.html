<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <div class = "top-header">
                <span>
                    Workstation:
                </span>

                <span id="workstation-name">
                </span>

                <span class = "workstation-select-box">
                    <button id="change-workstation">
                        Change
                    </button>
                    
                    <div id="workstation-options">
                    </div>
                </span>
            </div>
            
            <div class = "button-box">
                <button id="scan-label">
                    🔍 Scan Label
                </button>

                <button id="create-package">
                    + Create Package
                </button>

                <button id="scan-layer">
                    ⛶ Scan Layer
                </button>
            </div>

            <input id="label-input" type="text" placeholder="𝄃𝄂𝄂𝄀𝄁𝄃𝄂𝄂𝄃𝄃𝄂𝄂 Scan ICN Label To Start">
        </header>

        <main>
            <h2>
                Packages
            </h2>

            <div id="package-tab-details">
            </div>

        </main>

        <script src="script.js"></script>
    </body>
</html>
